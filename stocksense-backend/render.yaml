services:
  - type: web
    name: stocksense-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TWELVE_DATA_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: stocksense-redis
          type: redis
          property: connectionString

  - type: redis
    name: stocksense-redis
    plan: free
